name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace with spaces
      - uses: actions/setup-node@v4
        with:
          node-version-file: workspace with spaces/.node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install Linux browser libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
      - name: Install from lockfile
        working-directory: workspace with spaces
        run: pnpm install --frozen-lockfile
      - name: Verify source and builds
        working-directory: workspace with spaces
        run: pnpm verify
      - name: Verify dashboard startup
        working-directory: workspace with spaces
        run: pnpm test:dashboard
      - name: Verify rendered video and reference frames
        working-directory: workspace with spaces
        run: pnpm test:render
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: workspace with spaces/out/smoke/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify core scene video and reference frames
        working-directory: workspace with spaces
        run: pnpm test:scene
      - name: Upload core scene evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-${{ matrix.os }}
          path: workspace with spaces/out/scene/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify themed assets and pinned revisions
        working-directory: workspace with spaces
        run: pnpm test:assets
      - name: Upload asset render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}
          path: workspace with spaces/out/assets/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify layouts, animation, and camera renders
        working-directory: workspace with spaces
        run: pnpm test:motion
      - name: Upload motion render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-${{ matrix.os }}
          path: workspace with spaces/out/motion/
          if-no-files-found: warn
          retention-days: 7
